<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <!-- frame-src: 'self' covers localfile iframes (same-origin relative src);
         https://*.ts.net:8443 is the Web pane's dev-server CONTENT origin —
         same tailscale hostname, second HTTPS port (spec T15, INSTALL.md Step
         4.3b). Port kept in sync with the daemon's MV_WEBPANE_CONTENT_PORT
         default and WebPane.tsx's WEBPANE_CONTENT_PORT. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; frame-src 'self' https://*.ts.net:8443; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MicroViber</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
